---
hosts: all
become: true  
tasks:
  - name: Install Nginx
    apt:
      name: nginx
      state: present
      update_cache: yes

  - name: Start Nginx service
    service:
      name: nginx
      state: started
      enabled: yes  
---
hosts: all
become: yes 
tasks:
  - name: Install Apache
    apt:
      name: apache2
      state: present
      update_cache: yes

  - name: Start Apache service
    service:
      name: apache2
      state: started
      enabled: yes

---
hosts: all
become: all
tasks:
 - name: Install wget
   yum:
    name: wget
    state: present
    
